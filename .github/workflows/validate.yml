      - name: Syntax-check read-only governed audit/provider operator tool
        run: node --check scripts/operational-readonly-qualification-04f.mjs
      - name: Validate constitutional authority catalog
        run: node scripts/validate-constitution.mjs
      - name: Run constitutional model regression tests
        run: node --test tests/constitutional.test.mjs
      - name: Validate complete Article I authority and constraints
        run: node scripts/validate-article-i.mjs
      - name: Test Article I authority, limitations and capabilities
        run: node --test tests/article-i.test.mjs
      - name: Validate complete Article II powers and constraints
        run: node scripts/validate-article-ii.mjs
      - name: Test Article II executive authority and limitations
        run: node --test tests/article-ii.test.mjs
      - name: Validate complete Article III judicial authority, jurisdiction and safeguards
        run: node scripts/validate-article-iii.mjs
