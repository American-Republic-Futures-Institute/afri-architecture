name: Validate architecture catalog
on:
  pull_request:
    paths:
      - "model/**"
      - "schemas/**"
      - "scripts/validate.mjs"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "model/**"
      - "schemas/**"
      - "scripts/validate.mjs"
      - ".github/workflows/validate.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate federal architecture
        run: node scripts/validate.mjs
