          node scripts/operational-custody-04f.mjs --propose-index > /dev/null
          node scripts/operational-custody-04f.mjs --view exceptions > /dev/null
          node scripts/operational-custody-04f.mjs --view legal > /dev/null
          node scripts/operational-custody-04f.mjs --release-readiness
      - name: Test 04F source pins, VA candidate identity and independent governance gates
        run: node --test tests/operational-custody04f.test.mjs
      - name: Test synthetic exact-original replay, content-addressed staging and tampering safeguards
        run: node --test tests/replay-originals04f.test.mjs
      - name: Test externally root-bound dual-account archive reads and AWS audit digest prequalification
