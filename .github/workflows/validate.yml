        run: node --test tests/federalism.test.mjs
      - name: Validate all 27 amendment provisions and legal-effect chronology
        run: node scripts/validate-amendments.mjs
      - name: Test amendment ratification, supersession, rights and historical controls
        run: node --test tests/amendments.test.mjs
      - name: Validate holding-level judicial interpretations, precedent changes and legal review status
        run: node scripts/validate-judicial.mjs
      - name: Test judicial review, precedent scope and overruling regressions
        run: node --test tests/judicial.test.mjs
      - name: Validate original Constitution Articles IV–VII
        run: node scripts/validate-article-iv-vii.mjs
      - name: Test Articles IV–VII source links, ratification safeguards and historical constraints
        run: node --test tests/article-iv-vii.test.mjs
      - name: Validate source-backed Article and Amendment focused projection contracts
        run: node scripts/validate-focused-projections.mjs --validate
      - name: Test focused constitutional views, composed queries and legal-provenance controls
        run: node --test tests/focused-projection.test.mjs
      - name: Ensure PDF original statement text extractor is available
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Validate INC10 original Treasury and OMB PDFs and read source account statements
        run: node scripts/validate-inc10.mjs
      - name: Test INC10 official PDF source tampering, fiscal category identity and unresolved VA controls
        run: node --test tests/inc10-originals-and-reconciliation.test.mjs
      - name: Verify INC09 original government VA FY2025 TAS File A ZIP, CSV, account snapshot and agency period certification evidence
