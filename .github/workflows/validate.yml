name: Validate architecture catalog
on:
  pull_request:
    paths:
      - "model/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "model/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate federal architecture
        run: node scripts/validate.mjs
      - name: Validate constitutional authority catalog
        run: node scripts/validate-constitution.mjs
      - name: Run constitutional model regression tests
        run: node --test tests/constitutional.test.mjs
      - name: Validate complete Article I authority and constraints
        run: node scripts/validate-article-i.mjs
      - name: Test Article I authority, limitations and capabilities
        run: node --test tests/article-i.test.mjs
      - name: Validate complete Article II powers and constraints
        run: node scripts/validate-article-ii.mjs
      - name: Test Article II executive authority and limitations
        run: node --test tests/article-ii.test.mjs
      - name: Validate complete Article III judicial authority, jurisdiction and safeguards
        run: node scripts/validate-article-iii.mjs
      - name: Test Article III legal boundary regressions
        run: node --test tests/article-iii.test.mjs
      - name: Validate federalism, intergovernmental authority and rights
        run: node scripts/validate-federalism.mjs
      - name: Test federalism, supremacy and Fourteenth Amendment safeguards
        run: node --test tests/federalism.test.mjs
      - name: Validate all 27 amendment provisions and legal-effect chronology
        run: node scripts/validate-amendments.mjs
      - name: Test amendment ratification, supersession, rights and historical controls
        run: node --test tests/amendments.test.mjs
      - name: Validate holding-level judicial interpretations, precedent changes and legal review status
        run: node scripts/validate-judicial.mjs
      - name: Test judicial review, precedent scope and overruling regressions
        run: node --test tests/judicial.test.mjs
      - name: Validate State jurisdictions, source authorities and institutional boundaries
        run: node scripts/validate-state.mjs
      - name: Test State source, D.C., federalism and judicial conflict regressions
        run: node --test tests/state.test.mjs
      - name: Validate State statutory enabling authority and limits
        run: node scripts/validate-state-statutes.mjs
      - name: Test statute-proven authority, jurisdiction boundaries and publication safety
        run: node --test tests/state-statutes.test.mjs
