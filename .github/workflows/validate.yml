name: Validate architecture catalog
on:
  pull_request:
    paths:
      - "model/**"
      - "docs/**"
      - "evidence/**"
      - "README.md"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
      - "infra/evidence-archive-04e/**"
  push:
    branches: [main]
    paths:
      - "model/**"
      - "docs/**"
      - "evidence/**"
      - "README.md"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate federal architecture
        run: node scripts/validate.mjs
      - name: Validate INC-17A whole-government semantic definitions and existing predicate references
        run: node scripts/wholegov-contract-core.mjs
      - name: Test INC-17A jurisdiction, source status, legal non-promotion and viewpoint boundaries
        run: node --test tests/wholegov-contract.test.mjs
      - name: Validate INC-17B six source-qualified census families, original SHA-256 and disjoint source populations
        run: node scripts/inc17b-census-core.mjs
      - name: Reject INC-17B fabricated office identities, authority, federal command, ADL1 completeness and public Atlas admission
        run: node --test tests/inc17b-census.test.mjs
      - name: Replay INC-17B.2A six independent official statutory section original bytes and publisher clauses
        run: python3 scripts/inc17b2a-capture-statutes.py verify
      - name: Qualify INC-17B.2A bounded source-text leadership/composition and Cabinet edition crosswalk
        run: python3 scripts/inc17b2a-qualification-core.py
      - name: Reject INC-17B.2A false historical legal currentness, agency identity, command and public admission
        run: python3 -m unittest discover -s tests -p "test_inc17b2a_qualification.py" -v
      - name: Replay INC-17B.2B OLRC Public Law 119-124 original seven statutes and three official agency sources
        run: python3 scripts/inc17b2b-capture-official.py verify
      - name: Validate INC-17B.2B versioned legal/organizational source relationships and 15-department boundary register
        run: python3 scripts/inc17b2b-current-law-core.py
      - name: Reject INC-17B.2B state reorganizations, VA board/IG, DHS Coast Guard/IG and false legal-currentness or public graph admission
        run: python3 -m unittest discover -s tests -p "test_inc17b2b_current_law.py" -v
      - name: Independently verify retained OLRC publisher HTML originals, code release dates and Git blob receipts
        run: python3 scripts/inc16b-capture-usc-originals.py verify
      - name: Validate INC-16A dated mission functions and conditional HHS-DHS statutory interfaces
        run: node scripts/validate-inc16a.mjs
      - name: Reject INC-16A identity, command, legal, historical and public-graph false promotions
        run: node --test tests/inc16a.test.mjs
      - name: Validate INC-15 source-epoch institutional breadth and disjoint coverage denominators
        run: node scripts/validate-inc15.mjs
      - name: Test INC-15 original Git source blobs, Cabinet identities, and false legal/ADL claims
        run: node --test tests/inc15.test.mjs
      - name: Validate INC-15B 15-department source editions and 22 additional original ID crosswalks
        run: node scripts/validate-inc15b.mjs
      - name: Test INC-15B original-source integrity, publisher cohort overlap, and legal non-promotion
        run: node --test tests/inc15b.test.mjs
      - name: Validate INC-15C.1 historical DHS chart original source and incomplete first-level coverage
        run: node scripts/validate-inc15c1.mjs
      - name: Test INC-15C.1 immutable Git pins, ten original DHS/X12 links, IG/Coast Guard and forbidden legal authority
        run: node --test tests/inc15c1.test.mjs
      - name: Test INC-15C.2 exact official PDF allowlist, transient receipts and fail-closed source verification
        run: node --test tests/inc15c2-dhs-acquisition.test.mjs
      - name: Verify actual original DHS report SHA-256, Git blob and all 34 chart source boxes
        run: node scripts/validate-inc15c2.mjs
      - name: Reject altered publisher bytes, unverified identities, legal authority and false WORM custody
        run: node --test tests/inc15c2-chart.test.mjs
      - name: Validate INC-15C.3 historical HHS publisher index and immutable source pin
        run: node scripts/validate-inc15c3.mjs
      - name: Test INC-15C.3 HHS 29 names and unsupported legal or cross-government mission promotions
        run: node --test tests/inc15c3.test.mjs
      - name: Verify preserved whole-issue GovInfo XML original SHA-256, Git blob and false authority limits
        run: node scripts/validate-inc15d-source.mjs
      - name: Reject tampered INC-15D source, custody, temporal epoch and legal promotions
        run: node --test tests/inc15d-source-custody.test.mjs
      - name: Replay complete 2025 Government Manual publisher XML and all derived institutional records
        run: python3 scripts/inc15d-govman-directory.py
      - name: Test closed INC-15D source schemas, provisional crosswalk and false legal authority rejections
        run: python3 -m unittest discover -s tests -p 'test_inc15d_directory.py' -v
      - name: Verify INC-15D.5 all 28 original-source Interior Labor Transportation dispositions and cohort metrics
        run: python3 scripts/inc15d5-govman-reconcile.py
      - name: Test INC-15D.5 closed source-epoch schemas, prior candidate pointers and false canonical, statute, command, or ADL-1 promotions
        run: python3 -m unittest discover -s tests -p 'test_inc15d5_reconciliation.py' -v
      - name: Verify INC-15D.6 complete Commerce/Education 15-entry source hierarchy and original replay
        run: python3 scripts/inc15d6-govman-reconcile.py
      - name: Reject INC-15D.6 false Education federal agency status, legal command, fiscal attribution, 2026 web custody, or Atlas admission
        run: python3 -m unittest discover -s tests -p 'test_inc15d6_reconciliation.py' -v
      - name: Verify INC-15D.7 original independent-agency category and 15 of 15 source-only identities
        run: python3 scripts/inc15d7-govman-reconcile.py
      - name: Reject INC-15D.7 unqualified successor, Federal Reserve Board equivalence, legal authority, currentness and Atlas assertions
        run: python3 -m unittest discover -s tests -p 'test_inc15d7_reconciliation.py' -v
      - name: Verify INC-15D.8 Arts Foundation hierarchy, Amtrak corporation label and exact second-15 original entries
        run: python3 scripts/inc15d8-govman-reconcile.py
      - name: Reject INC-15D.8 forged legal corporate subtype, Foundation control, publisher parent, fiscal or Atlas authority
        run: python3 -m unittest discover -s tests -p 'test_inc15d8_reconciliation.py' -v
      - name: Verify INC-15D.9 final 15 independent entries and disjoint whole-GovMan 231/50/88/93 coverage
        run: python3 scripts/inc15d9-govman-reconcile.py
      - name: Test INC-15D.9 original source, OPIC succession denial, USAID temporality and evidence-status coverage
        run: python3 -m unittest discover -s tests -p 'test_inc15d9_reconciliation.py' -v
      - name: Verify INC-15E.1 original publisher and typed identity relationship registry without statute-original promotion
        run: python3 scripts/inc15e1-identity-reconcile.py
      - name: Test INC-15E.1 Board-system distinction, OPIC succession, USAID epoch and Atlas admission denial
        run: python3 -m unittest discover -s tests -p 'test_inc15e1_identity_reconciliation.py' -v
      - name: Verify INC-15E.1B exact original GPO 2024 Amtrak status and SHA-256 Git blob evidence
        run: python3 scripts/inc15e1b-capture-amtrak-original.py verify
      - name: Validate INC-15E.1B narrow statutory text relationship with no unreviewed identity or Atlas promotion
        run: python3 scripts/inc15e1b-amtrak-qualify.py
      - name: Reject INC-15E.1B statutory epoch, source tamper, constitutional status and false federal agency inference
        run: python3 -m unittest discover -s tests -p 'test_inc15e1b_amtrak_legal_status.py' -v
      - name: Validate INC-15C.4 historical HHS 11-to-29 bounded publisher edition overlap
        run: node scripts/validate-inc15c4.mjs
      - name: Test INC-15C.4 immutable source pins, CMS naming variant, IG protection and no invented HHS legal hierarchy
        run: node --test tests/inc15c4.test.mjs
      - name: Validate INC-15C.5 original ED FY2024 ERIC-distributed PDF byte and Git custody
        run: node scripts/validate-inc15c5-original.mjs
      - name: Reject tampered Education source original, false publisher custody, legal authority and false WORM qualification
        run: node --test tests/inc15c5-education-custody.test.mjs
      - name: Validate INC-15C.5 ED FY2024 original-pinned chart and ten historical office crosswalks
        run: node scripts/validate-inc15c5-chart.mjs
      - name: Reject INC-15C.5 source chart tampering, invented reporting, IG command and current legal census
        run: node --test tests/inc15c5-education-chart.test.mjs
      - name: Verify retained HHS OIG December 2025 original HTML PDF and blocked wider publisher claims
        run: node scripts/validate-inc15c6-oig-original.mjs
      - name: Reject altered HHS OIG original, false DAB or OMHA custody and inflated legal office identities
        run: node --test tests/inc15c6-hhs-oig-custody.test.mjs
      - name: Validate INC-15C.6 source-backed six OIG groups and four HHS special institutional boundaries
        run: node scripts/validate-inc15c6-model.mjs
      - name: Test INC-15C.6 HHS original and statutory boundary protection against adversarial source/model promotion
        run: node --test tests/inc15c6-hhs-model.test.mjs
      - name: Verify INC-15C.6D five retained official GovInfo and ARPA-H PDF originals and immutable receipts
        run: python3 scripts/inc15c6d-validate-original-custody.py
      - name: Reject INC-15C.6D original tampering, false current HHS office counts, ALJ authority and planned ARPA-H implementation
        run: python3 -m unittest discover -s tests -p 'test_inc15c6d_original_custody.py' -v
      - name: Validate INC-15C.6D DAB OMHA ARPA-H historical notice and original chart source models
        run: python3 scripts/inc15c6d-validate-historical-models.py
      - name: Negative test INC-15C.6D source-era, 14-to-8 ARPA-H plan, legal/ALJ authority and schema coforgery
        run: python3 -m unittest discover -s tests -p 'test_inc15c6d_historical_models.py' -v
      - name: Verify INC-15C.6E official ARPA-H people/timeline original HTML and blocked HHS budget source receipts
        run: python3 scripts/inc15c6e-validate-original-custody.py
      - name: Reject INC-15C.6E source tampering, false enacted 2026 budget or ARPA-H signed reorganization
        run: python3 -m unittest discover -s tests -p 'test_inc15c6e_original_custody.py' -v
      - name: Validate INC-15C.6E FY2026/FY2027 budget proposals and ARPA-H observed office epoch models
        run: python3 scripts/inc15c6e-validate-models.py
      - name: Reject INC-15C.6E invented HHS office implementation, jurisdiction or schema/cohort tampering
        run: python3 -m unittest discover -s tests -p 'test_inc15c6e_models.py' -v
      - name: Verify INC-15C.6F two original GovInfo OCR notices, Git SHA and 2023/2026 effective dates
        run: python3 scripts/inc15c6f-validate-original-custody.py
      - name: Reject INC-15C.6F forged OCR original, false HHS office completeness and delegated case powers
        run: python3 -m unittest discover -s tests -p 'test_inc15c6f_original_custody.py' -v
      - name: Validate INC-15C.6F signed OCR 2026 operative internal structure, 2023 predecessor and scoped typed relations
        run: python3 scripts/inc15c6f-validate-ocr-models.py
      - name: Reject INC-15C.6F forged organizational entries, dates, delegation, HHS budget execution or model/schema coforgery
        run: python3 -m unittest discover -s tests -p 'test_inc15c6f_ocr_models.py' -v
      - name: Ensure PDF original tooling available for INC-15C.6G OGC source inspection
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
          fi
      - name: Verify INC-15C.6G official five-page OGC original source SHA and independent receipts
        run: python3 scripts/inc15c6g-ogc-original.py verify
      - name: Reject INC-15C.6G forged 2026 OGC original, authority, independent legal effective date and custody
        run: python3 -m unittest discover -s tests -p 'test_inc15c6g_original_custody.py' -v
      - name: Verify INC-15C.6G independently pinned source and typed OGC office, role, legal interface registers
        run: python3 scripts/inc15c6g-validate-ogc-models.py
      - name: Reject INC-15C.6G fabricated HHS command, ALJ powers, OIG override, UAC conflict or source/schema co-forgery
        run: python3 -m unittest discover -s tests -p 'test_inc15c6g_ogc_models.py' -v
      - name: Verify INC-15C.6H five original FDA CFR OIG EO publisher sources against pinned bytes and edition-local dates
        run: python3 scripts/inc15c6h-capture-source-editions.py verify
      - name: Reject INC-15C.6H forged publisher originals, 1997 granule source inflation and 2026 FDA revoked citation
        run: python3 -m unittest discover -s tests -p 'test_inc15c6h_original_custody.py' -v
      - name: Validate INC-15C.6H exact source editions, dated revoked citations, OIG counsel history and legal nonpromotion
        run: python3 scripts/inc15c6h-validate-counsel-models.py
      - name: Reject INC-15C.6H source tampering, repealed-law resurrection, fabricated ALJ/OIG powers and schema coforgery
        run: python3 -m unittest discover -s tests -p 'test_inc15c6h_counsel_models.py' -v
      - name: Validate bounded federal institutional census, taxonomy and immutable source editions
        run: node scripts/validate-federal-census.mjs --validate
      - name: Validate federal institutional census reference views
        run: node scripts/validate-federal-census.mjs --view VIEW-CENSUS-DEFENSE-COMPONENTS > /dev/null
      - name: Validate all eight federal census JSON Schema contracts
        run: node scripts/validate-federal-census-schema.mjs
      - name: Test federal identity crosswalk, first-level pilot and legal-authority fail-closed regressions
        run: node --test tests/federal-census.test.mjs
      - name: Validate Increment 03 federal coverage expansion and cross-branch source bounds
        run: node scripts/validate-federal-expansion.mjs --validate
      - name: Validate all nine Increment 03 expansion JSON Schema collections
        run: node scripts/validate-federal-expansion-schema.mjs
      - name: Validate scoped federal atlas, Cabinet root and judicial viewpoints
        run: |
          node scripts/validate-federal-expansion.mjs --view VIEW-EXP-ALL > /dev/null
          node scripts/validate-federal-expansion.mjs --view VIEW-EXP-DEPARTMENTS --root ORG-FED-EXE-DEP-TREASURY > /dev/null
          node scripts/validate-federal-expansion.mjs --view VIEW-EXP-JUDICIARY > /dev/null
      - name: Test cross-branch source provenance, ADL non-promotion and denominator security
        run: node --test tests/federal-expansion.test.mjs
      - name: Validate Increment 04 dated federal departmental source granules and organizational boundaries
        run: node scripts/validate-federal-department-structure.mjs --validate
      - name: Validate nine Increment 04 strict JSON Schema model families
        run: node scripts/validate-federal-department-structure-schema.mjs
      - name: Project four dated department structures and the twelve official granule roots
        run: |
          node scripts/validate-federal-department-structure.mjs --view VIEW-DEPT04-GOVMAN-12 > /dev/null
          node scripts/validate-federal-department-structure.mjs --view VIEW-DEPT04-JUSTICE > /dev/null
          node scripts/validate-federal-department-structure.mjs --view VIEW-DEPT04-VA > /dev/null
          node scripts/validate-federal-department-structure.mjs --view VIEW-DEPT04-TREASURY > /dev/null
          node scripts/validate-federal-department-structure.mjs --view VIEW-DEPT04-COMMERCE > /dev/null
      - name: Test official source identity, organizational boundaries, IG independence and ADL-1 safeguards
        run: node --test tests/federal-department-structure.test.mjs
      - name: Validate bounded Increment 04B HHS, evidence archive and legal classification contracts
        run: node scripts/validate-federal-archive04b.mjs --validate
      - name: Validate nine strict JSON Schema source, original receipt and review model families
        run: node scripts/validate-federal-archive04b-schema.mjs
      - name: Project dated, source-bounded four department comparison views
        run: |
          node scripts/validate-federal-archive04b.mjs --view VIEW-ARCH04B-JUSTICE > /dev/null
          node scripts/validate-federal-archive04b.mjs --view VIEW-ARCH04B-TREASURY > /dev/null
          node scripts/validate-federal-archive04b.mjs --view VIEW-ARCH04B-HHS > /dev/null
          node scripts/validate-federal-archive04b.mjs --view VIEW-ARCH04B-VA > /dev/null
      - name: Test source identity, section denominators, independent legal review and anti-ADL certification
        run: node --test tests/federal-archive04b.test.mjs
      - name: Test exact captured byte SHA-256, tampering, redirect and change-detection controls
        run: node --test tests/federal-source-capture.test.mjs
      - name: Validate Increment 04C source custody, VA directory and statutory composition research
        run: node scripts/validate-federal-evidence04c.mjs --validate
      - name: Validate all nine Increment 04C strict JSON Schema models
        run: node scripts/validate-federal-evidence04c-schema.mjs
      - name: Test VA legal composition, independent signoff and source provenance safeguards
        run: node --test tests/federal-evidence04c.test.mjs
      - name: Test Ed25519 signer allowlist, content-addressed objects and tampering controls
        run: node --test tests/durable-evidence04c.test.mjs
      - name: Test VA 3 plus 19 source-heading parser
        run: python3 -m unittest discover -s tests -p 'test_va_source_04c.py'
      - name: Validate Inc04D nine-model VA historical/statutory and source-custody scope
        run: node scripts/validate-va-04d.mjs --validate
      - name: Validate nine strict JSON Schema original-evidence and legal-review families
        run: node scripts/validate-va-04d.mjs --schema
      - name: Verify institutional signer and protected release remain unratified
        run: node scripts/validate-va-04d.mjs --release-readiness
      - name: Test VA 04D source digests, legal status, institutional exceptions and ADL security
        run: node --test tests/va-evidence04d.test.mjs
      - name: Test dual Ed25519 trust, tamper rejection and WORM proof nonpromotion
        run: node --test tests/va-controlled-release04d.test.mjs
      - name: Validate 04E unratified governance and VA institutional source/ADL1 scope
        run: node scripts/arfi-evidence-ops-04e.mjs --validate
      - name: Validate seven closed 04E research schema collections
        run: node scripts/arfi-evidence-ops-04e.mjs --schema
      - name: Project legal exception, sources and qualification views without certifying institutions
        run: |
          node scripts/arfi-evidence-ops-04e.mjs --view legal > /dev/null
          node scripts/arfi-evidence-ops-04e.mjs --view sources > /dev/null
          node scripts/arfi-evidence-ops-04e.mjs --view qualification > /dev/null
      - name: Test 04E governance, authority, temporality and anti-certification controls
        run: node --test tests/va-institutional-trust04e.test.mjs
      - name: Test live AWS WORM storage preconditions without AWS credentials or cloud changes
        run: node --test tests/va-live-worm04e.test.mjs
      - name: Test offline root signers, revocation, role independence and release-manifest binding
        run: node --test tests/va-trust-crypto04e.test.mjs
      - name: Validate source-bounded Title 10 defense institution and authority decomposition
        run: node scripts/validate-dod.mjs --validate
      - name: Validate statutory command, GAO Defense Agency and fiscal request viewpoints
        run: node scripts/validate-dod.mjs --view VIEW-DOD-COMMAND > /dev/null && node scripts/validate-dod.mjs --view VIEW-DOD-DAFA > /dev/null && node scripts/validate-dod.mjs --view VIEW-DOD-FISCAL > /dev/null
      - name: Verify all 20 typed DoD constitutional, statutory, institutional and fiscal data contracts
        run: node scripts/validate-dod-schema.mjs
