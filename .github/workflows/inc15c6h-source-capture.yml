name: INC-15C.6H source-original archival qualification
on:
  pull_request:
    paths:
      - "scripts/inc15c6h-capture-source-editions.py"
      - ".github/workflows/inc15c6h-source-capture.yml"
permissions:
  contents: write
jobs:
  official-source-custody:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15c6h-official-source-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c6h-official-source-custody
          persist-credentials: true
          fetch-depth: 1
      - name: Ensure original PDFs can be inspected
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
          fi
      - name: Capture exact original GovInfo FDA final rule, historical CFR, OIG issue, EO and FDA organizational chart
        run: python3 scripts/inc15c6h-capture-source-editions.py acquire
      - name: Independently replay Git byte/SHA receipts, source date and authority checks
        run: python3 scripts/inc15c6h-capture-source-editions.py verify
      - name: Commit official original publisher bytes to isolated source branch
        run: |
          set -euo pipefail
          git config user.name "arfi-architecture-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hhs-counsel-source-editions/
          if git diff --cached --quiet; then
            echo "Exact original publisher evidence already retained"
          else
            git commit -m "evidence(inc15c6h): retain official FDA/CFR/OIG/EO originals and Git custody"
            git push origin HEAD:refs/heads/feat/inc15c6h-official-source-custody
          fi
