name: INC-15C.6D promote reviewed historical government originals to Git
on:
  pull_request:
    paths:
      - ".github/workflows/inc15c6d-promote-originals.yml"
      - "scripts/inc15c6d-promote-historical-originals.py"
permissions:
  contents: write
  actions: read
jobs:
  promote-five-sources:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15c6d-govinfo-arpa-original-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c6d-govinfo-arpa-original-custody
          fetch-depth: 1
          persist-credentials: true
      - name: Ensure reproducible PDF metadata and text inspection
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
      - name: Download only reviewed original acquisition artifact 12389115569
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inc15c6d"
          curl --retry 3 --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/12389115569/zip" \
            -o "$RUNNER_TEMP/inc15c6d/source-originals.zip"
      - name: Reverify five source byte hashes, Git blobs, notice editions and ARPA-H planning caveat
        run: python3 scripts/inc15c6d-promote-historical-originals.py "$RUNNER_TEMP/inc15c6d/source-originals.zip"
      - name: Commit exact publisher originals and dual receipts to this PR branch
        run: |
          set -euo pipefail
          git config user.name "arfi-architecture-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hhs-dab-omha-arpah-historical/
          if git diff --cached --quiet; then
            echo "Original already byte-identical"
          else
            git commit -m "evidence(inc15c6d): retain five historical official HHS notice and ARPA-H PDF originals"
            git push origin HEAD:refs/heads/feat/inc15c6d-govinfo-arpa-original-custody
          fi
