name: INC-15C.6E preserve exact ARPA-H publisher HTML originals in Git
on:
  pull_request:
    paths:
      - ".github/workflows/inc15c6e-promote-arpah-source.yml"
      - "scripts/inc15c6e-promote-arpah-originals.py"
permissions:
  contents: write
  actions: read
jobs:
  promote-official-snapshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15c6e-arpah-2026-html-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c6e-arpah-2026-html-custody
          fetch-depth: 1
          persist-credentials: true
      - name: Download reviewed acquisition artifact 12389997023 from same GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inc15c6e"
          curl --retry 3 --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/12389997023/zip" \
            -o "$RUNNER_TEMP/inc15c6e/approved.zip"
      - name: Independently verify source URL outcome, original ARPA-H bytes and no false HHS budget custody
        run: python3 scripts/inc15c6e-promote-arpah-originals.py "$RUNNER_TEMP/inc15c6e/approved.zip"
      - name: Commit exact HTML originals and separate source receipts to isolated PR branch
        run: |
          set -euo pipefail
          git config user.name "arfi-architecture-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hhs-arpah-2026-observation/
          if git diff --cached --quiet; then
            echo "Already retained exact official source originals"
          else
            git commit -m "evidence(inc15c6e): retain dated ARPA-H publisher people/timeline HTML originals"
            git push origin HEAD:refs/heads/feat/inc15c6e-arpah-2026-html-custody
          fi
