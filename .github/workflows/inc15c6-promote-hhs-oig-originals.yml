name: INC-15C.6 promote source-verified HHS OIG originals to Git custody
on:
  pull_request:
    paths:
      - '.github/workflows/inc15c6-promote-hhs-oig-originals.yml'
      - 'scripts/inc15c6-promote-oig-original.py'
permissions:
  contents: write
  actions: read
jobs:
  preserve-originals:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15c6-hhs-oig-original-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c6-hhs-oig-original-custody
          fetch-depth: 1
          persist-credentials: true
      - name: Install PDF metadata and textual inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download only fixed original-source artifact 12378132516
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inc15c6-archive"
          curl --fail --show-error --silent --retry 3 --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/12378132516/zip" \
            -o "$RUNNER_TEMP/inc15c6-archive/approved-source.zip"
      - name: Re-verify all seven official source receipts and exact two OIG originals
        run: python3 scripts/inc15c6-promote-oig-original.py "$RUNNER_TEMP/inc15c6-archive/approved-source.zip"
      - name: Commit retained sources and separate Git receipt to this PR only
        run: |
          set -euo pipefail
          git config user.name "arfi-source-preservation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hhs-oig-2025/
          if git diff --cached --quiet; then
            echo 'Already retained identical original source'
          else
            git commit -m 'evidence(inc15c6): retain official HHS OIG 2025 chart PDF and HTML originals'
            git push origin HEAD:refs/heads/feat/inc15c6-hhs-oig-original-custody
          fi
