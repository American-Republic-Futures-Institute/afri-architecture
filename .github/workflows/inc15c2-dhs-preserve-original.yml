name: Preserve DHS FY2024 original PDF in research Git evidence
on:
  push:
    branches:
      - feat/inc15c2-dhs-original-capture-research
    paths:
      - ".github/workflows/inc15c2-dhs-preserve-original.yml"
permissions:
  contents: write
jobs:
  preserve-official-original:
    if: github.repository == 'American-Republic-Futures-Institute/afri-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c2-dhs-original-capture-research
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture original PDF from the exact official DHS URL
        run: node scripts/inc15c2-dhs-original.mjs probe "$RUNNER_TEMP/arfi-inc15c2-publisher-original"
      - name: Require actual PDF bytes and independently re-verify their SHA-256
        run: |
          node scripts/inc15c2-dhs-original.mjs require-original "$RUNNER_TEMP/arfi-inc15c2-publisher-original"
          source_file="$RUNNER_TEMP/arfi-inc15c2-publisher-original/originals/sha256/d48f661bf9d6643409585451a2dc49f53358fe869dd40d182344f0bed58e4175.pdf"
          test -f "$source_file"
          test "$(sha256sum "$source_file" | cut -d ' ' -f 1)" = "d48f661bf9d6643409585451a2dc49f53358fe869dd40d182344f0bed58e4175"
          test "$(stat -c %s "$source_file")" = "17622005"
          if command -v pdfinfo > /dev/null 2>&1; then
            pdfinfo "$source_file" | grep -q "Pages: *273"
          fi
      - name: Stage exact source PDF, source-attempt receipt and non-WORM promotion manifest
        run: |
          sha="d48f661bf9d6643409585451a2dc49f53358fe869dd40d182344f0bed58e4175"
          dirname="evidence/dhs-fy2024/originals/sha256"
          mkdir -p "$dirname" "evidence/dhs-fy2024/receipts"
          cp "$RUNNER_TEMP/arfi-inc15c2-publisher-original/originals/sha256/$sha.pdf" "$dirname/$sha.pdf"
          cp "$RUNNER_TEMP/arfi-inc15c2-publisher-original/capture-receipt.json" "evidence/dhs-fy2024/receipts/inc15c2-official-source-capture.json"
          gitblob="$(git hash-object "$dirname/$sha.pdf")"
          node --input-type=module -e '
            import fs from "node:fs";
            const rec=JSON.parse(fs.readFileSync("evidence/dhs-fy2024/receipts/inc15c2-official-source-capture.json","utf8"));
            const entry={
              id:"INC15C2-DHS-FY2024-GIT-SOURCE-EVIDENCE",
              publisher_url:rec.acquired_url,
              source_edition:"FY2024",
              claimed_published_on:"2025-01-17",
              captured_at_utc:rec.attempts.at(-1).attempted_at_utc,
              original_pdf_sha256:rec.original_sha256,
              original_pdf_byte_count:rec.original_byte_count,
              original_pdf_git_blob_sha:process.env.GIT_SOURCE_BLOB_SHA,
              original_repository_path:"evidence/dhs-fy2024/originals/sha256/"+rec.original_sha256+".pdf",
              storage_tier:"git_versioned_source_original_no_independent_WORM_attestation",
              independent_WORM_custody_verified:false,
              source_page_24_independently_reviewed:false,
              current_first_level_DHS_denominator:null,
              legal_review_complete:false,
              adl1_certified_count:0
            };
            fs.writeFileSync("evidence/dhs-fy2024/receipts/inc15c2-git-retention.json",JSON.stringify(entry,null,2)+"\n");
          ' 
        env:
          GIT_SOURCE_BLOB_SHA: ""
      - name: Commit original PDF as a versioned research evidence object (not ADL-1)
        run: |
          git config user.name "ARFI source evidence automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/dhs-fy2024/originals evidence/dhs-fy2024/receipts
          git diff --cached --quiet && exit 0
          git commit -m "evidence(inc15c2): retain exact official DHS FY2024 source PDF with SHA-256"
          git push origin HEAD:feat/inc15c2-dhs-original-capture-research
