name: INC-15C.6F promote reviewed GovInfo OCR original PDFs into Git
on:
  pull_request:
    paths:
      - ".github/workflows/inc15c6f-promote-ocr-originals.yml"
      - "scripts/inc15c6f-promote-ocr-originals.py"
permissions:
  contents: write
  actions: read
jobs:
  promote:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15c6f-ocr-original-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15c6f-ocr-original-custody
          fetch-depth: 1
          persist-credentials: true
      - name: Provide PDF page count and source-text inspection commands
        run: sudo apt-get update -qq && sudo apt-get install -qq -y poppler-utils
      - name: Download exact approved official GovInfo acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inc15c6f"
          curl --retry 3 --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/12429386599/zip" \
            -o "$RUNNER_TEMP/inc15c6f/source-originals.zip"
      - name: Verify 2023/2026 original content hashes, published dates and organization excerpts
        run: python3 scripts/inc15c6f-promote-ocr-originals.py "$RUNNER_TEMP/inc15c6f/source-originals.zip"
      - name: Commit exact original PDFs with separate official-source acquisition and Git receipts
        run: |
          set -euo pipefail
          git config user.name "arfi-architecture-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hhs-ocr-org-2023-2026/
          if git diff --cached --quiet; then
            echo "Byte-identical original PDFs already retained"
          else
            git commit -m "evidence(inc15c6f): retain 2023 and effective 2026 original OCR organization notices"
            git push origin HEAD:refs/heads/feat/inc15c6f-ocr-original-custody
          fi
