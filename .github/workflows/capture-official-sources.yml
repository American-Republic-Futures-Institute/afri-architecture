name: Capture bounded official federal sources
on:
  pull_request:
    paths:
      - "model/federal/archive04b/**"
      - "scripts/federal-source-archive-core.mjs"
      - "scripts/capture-federal-official-sources.mjs"
      - ".github/workflows/capture-official-sources.yml"
permissions:
  contents: read
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/federal-source-archive-reconciliation-inc04b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture original HTTP response entity bytes and compute SHA-256 receipts
        run: |
          node scripts/capture-federal-official-sources.mjs --live "$RUNNER_TEMP/arfi-source-capture04b"
          node scripts/capture-federal-official-sources.mjs --verify "$RUNNER_TEMP/arfi-source-capture04b"
      - name: Retain exact captured bytes and SHA-256 manifest as review artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arfi-federal-primary-source-capture-04b
          path: ${{ runner.temp }}/arfi-source-capture04b/
          if-no-files-found: error
          retention-days: 90
