name: INC-15D promote verified 2025 Government Manual original to Git custody
on:
  pull_request:
    paths:
      - ".github/workflows/inc15d-promote-original.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  promote-pinned-artifact:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/inc15d-original-git-custody' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inc15d-original-git-custody
          persist-credentials: true
          fetch-depth: 1
      - name: Recover exclusively approved source artifact, verify original, and stage custody
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/inc15d"
          curl --retry 3 --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/actions/artifacts/12372126121/zip" \
            -o "${RUNNER_TEMP}/inc15d/approved.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, zipfile, xml.etree.ElementTree as ET
          approved='c1e5b58cce0a018b4995f900584605d07e473079a37d5a665a3a8ebb5d643138'
          original_name='originals/sha256/'+approved+'.xml'
          approved_names={'capture-receipt.json',original_name}
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'inc15d'/'approved.zip'
          with zipfile.ZipFile(archive) as z:
              listed={x.filename for x in z.infolist() if not x.is_dir()}
              if listed!=approved_names: raise RuntimeError('unexpected source artifact members')
              for member in z.infolist():
                  if member.file_size>32*1024*1024: raise RuntimeError('oversize artifact entry')
              content=z.read(original_name)
              rec=json.loads(z.read('capture-receipt.json'))
          if len(content)!=8138096 or hashlib.sha256(content).hexdigest()!=approved:
              raise RuntimeError('publisher source byte hash/length mismatch')
          if not content.startswith(b'<?xml') or b'<!DOCTYPE' in content or b'<!ENTITY' in content:
              raise RuntimeError('XML original unacceptable for isolated extraction')
          root=ET.fromstring(content)
          if root.tag!='GovernmentManual':
              raise RuntimeError('wrong government manual document root')
          allowed={'Entity','SubEntityLevelOne','SubEntityLevelTwo','SubEntityLevelThree'}
          entries=[node for node in root.iter() if node.tag in allowed]
          if len(root)!=105 or len(entries)!=231:
              raise RuntimeError('unexpected publisher entry population')
          if not (rec['package_id']=='GOVMAN-2025-12-31'
              and rec['original_sha256']==approved
              and rec['original_byte_count']==8138096
              and rec['status']=='captured_transient_pending_repository_and_independent_custody'
              and rec['independent_durable_custody_verified'] is False
              and rec['whole_federal_legal_institution_denominator'] is None
              and rec['current_first_level_institution_denominator'] is None
              and rec['any_legal_or_command_authority_certified'] is False):
              raise RuntimeError('capture receipt source identity or qualification mismatch')
          dest=pathlib.Path('evidence/govman-2025')
          obj=dest/original_name
          obj.parent.mkdir(parents=True,exist_ok=True)
          if obj.exists() and obj.read_bytes()!=content:
              raise RuntimeError('existing original has different bytes')
          obj.write_bytes(content)
          receipts=dest/'receipts';receipts.mkdir(parents=True,exist_ok=True)
          (receipts/'capture-receipt.json').write_text(json.dumps(rec,indent=2)+'\n',encoding='utf-8')
          import subprocess
          blob=subprocess.run(['git','hash-object',str(obj)],check=True,capture_output=True,text=True).stdout.strip()
          promotion={
              'record_type':'inc15d_govman_2025_repository_original_custody',
              'publisher_package':'GOVMAN-2025-12-31',
              'source_publication_date':'2025-12-31',
              'retrieval_artifact_id':12372126121,
              'retrieval_workflow_run_id':39655760881,
              'original_sha256':approved,
              'original_byte_count':len(content),
              'git_blob_sha1':blob,
              'git_repository_original_path':str(obj),
              'source_entries_parsed_at_promotion':231,
              'publisher_entry_count_legal_institution_denominator':False,
              'independent_worm_custody_verified':False,
              'human_legal_review_complete':False,
              'current_first_level_denominator':None,
              'operational_command_or_delegation_certified':False
          }
          (receipts/'repository-custody.json').write_text(json.dumps(promotion,indent=2)+'\n',encoding='utf-8')
          print('Verified official original',approved,'bytes',len(content),'directory entries',len(entries),'blob',blob)
          PY
      - name: Commit verified original and separate Git-custody receipt to this PR branch only
        run: |
          set -euo pipefail
          git config user.name "arfi-source-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/govman-2025/
          if git diff --cached --quiet; then
            echo "Identical source already retained; no change"
          else
            git commit -m "evidence(inc15d): retain verified official GovMan 2025 XML in Git"
            git push origin "HEAD:refs/heads/feat/inc15d-original-git-custody"
          fi
