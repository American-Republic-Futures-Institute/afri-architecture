name: One-time independent focused API public-client probe
on:
  push:
    branches: [audit/focused-architecture-external-client-probe]
    paths: [".github/workflows/focused-public-client-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Independent Node HTTPS client (no Vercel share-link or connector)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            "https://www.arfinstitute.org/api/focused-architecture?catalog=1",
            "https://arfinstitute.org/api/focused-architecture?catalog=1",
            "https://www.arfinstitute.org/api/focused-architecture?search=Department%20of%20State",
            "https://www.arfinstitute.org/api/focused-architecture?catalog=1&unexpected_external=1",
            "https://www.arfinstitute.org/api/architecture?catalog=1"
          ];
          for(const uri of urls){
            try{
              const response=await fetch(uri,{redirect:"follow",headers:{"Accept":"application/json","User-Agent":"ARFI-Source-Compatibility-Independent-Client"},signal:AbortSignal.timeout(20000)});
              const body=await response.text();
              let json={};try{json=JSON.parse(body);}catch{}
              const actual=new URL(response.url);
              console.log(JSON.stringify({requested:new URL(uri).origin+new URL(uri).pathname,
                originalQueryKeys:[...new URL(uri).searchParams.keys()],status:response.status,
                finalOrigin:actual.origin,finalPath:actual.pathname,
                commit:json.commit||null,scopes:json.scopes?.length||0,
                searchRecords:json.records?.length||0,entries:json.entries?.length||0,
                error:json.error||null,contentType:response.headers.get("content-type")}));
            }catch(error){console.log(JSON.stringify({url:uri,error:String(error)}));}
          }
          NODE
      - name: Independent curl direct HTTP status confirmation
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://www.arfinstitute.org/api/focused-architecture?catalog=1" "https://arfinstitute.org/api/focused-architecture?catalog=1" "https://www.arfinstitute.org/api/focused-architecture?catalog=1&unexpected_external=1"; do
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 --output /tmp/arfi-focused-probe-body --write-out '%{http_code}' "$url")"
            echo "curl status=$status target=$url response_head=$(head -c 100 /tmp/arfi-focused-probe-body)"
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare isolated Chromium browser probe
        run: |
          set -euo pipefail
          mkdir -p /tmp/arfi-focused-browser
          cd /tmp/arfi-focused-browser
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright-core@1.55.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright-core install --with-deps chromium
          fi
      - name: Test real focused constitutional and federal graph rendering desktop and mobile
        run: |
          cd /tmp/arfi-focused-browser
          node --input-type=module <<'NODE'
          import {chromium} from "playwright-core";
          import {execFileSync} from "node:child_process";
          import {existsSync} from "node:fs";
          const bins=["google-chrome","google-chrome-stable","chromium","chromium-browser"];
          let executablePath;
          for(const b of bins){
            try{executablePath=execFileSync("which",[b],{encoding:"utf8"}).trim();break;}catch{}
          }
          if(!executablePath&&existsSync(chromium.executablePath()))executablePath=chromium.executablePath();
          if(!executablePath)throw Error("Chromium unavailable: real browser required, not a silent skip");
          const browser=await chromium.launch({executablePath,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
          const expectedCommit="ae5d2da3067331a508eb6240c25b5bfb248a17a5";
          const scenarios=[
            {name:"focused-desktop",width:1365,height:900,view:"SCOPE-CONST-AMD-01",expected:34},
            {name:"focused-phone",width:390,height:844,view:"SCOPE-CONST-AMD-01",expected:34},
            {name:"federal-desktop",width:1365,height:900,view:"VIEW-FED-OVERVIEW",expected:null}
          ];
          try{
            for(const target of scenarios){
              const page=await browser.newPage({viewport:{width:target.width,height:target.height},reducedMotion:"reduce"});
              const api=[],pageErrors=[];
              page.on("pageerror",e=>pageErrors.push(String(e.message||e)));
              page.on("response",res=>{
                try{
                  const p=new URL(res.url()).pathname;
                  if(p.startsWith("/api/architecture")||p.startsWith("/api/focused-architecture")){
                    api.push({path:p,status:res.status()});
                  }
                }catch{}
              });
              const url="https://www.arfinstitute.org/architecture/?view="+encodeURIComponent(target.view);
              const doc=await page.goto(url,{waitUntil:"domcontentloaded",timeout:40000});
              if(doc?.status()!==200)throw Error(target.name+" page HTTP "+doc?.status());
              await page.locator("#loading").waitFor({state:"hidden",timeout:75000});
              const state=await page.evaluate(()=>({
                errorVisible:document.getElementById("error-state")?.hidden===false,
                errorText:document.getElementById("error-message")?.textContent,
                count:document.getElementById("graph-count")?.textContent,
                canvas:[...document.querySelectorAll("#graph canvas")].filter(c=>c.width>0&&c.height>0&&c.getBoundingClientRect().width>0).length,
                sourceStatus:document.getElementById("focused-scope-status")?.textContent,
                focusedButtons:document.querySelectorAll("button[data-scope]").length
              }));
              const required=target.expected?"/api/focused-architecture":"/api/architecture";
              const ok=api.some(x=>x.path.startsWith(required)&&x.status===200);
              if(state.errorVisible||!state.canvas||!/\d+ elements/.test(state.count||"")||
                 pageErrors.length||!ok||(target.expected&&state.focusedButtons!==34)){
                throw Error("Browser release gate failed "+JSON.stringify({target,state,api,pageErrors}));
              }
              if(target.expected&&state.sourceStatus&&!state.sourceStatus.includes(expectedCommit.slice(0,12))){
                throw Error("Focused browser commit indicator drift "+state.sourceStatus);
              }
              console.log(JSON.stringify({scenario:target.name,status:"passed",documentStatus:doc.status(),graphCount:state.count,canvasCount:state.canvas,
                focusedButtons:state.focusedButtons,api,pageErrors}));
              await page.close();
            }
          }finally{await browser.close();}
          NODE
